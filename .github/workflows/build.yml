name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --target TheCalm_VST3 TheCalm_CLAP

      - name: UI snapshot (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cmake --build build --config Release --target ui_snapshot
          S=$(find build -type f -name ui_snapshot -perm -u+x | head -1)
          "$S" ui.png 1024 || true
          "$S" ui_on.png 1024 octave1=1 || true

      - name: Collect (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir dist
          find build -name "*.vst3" -maxdepth 6 -exec cp -R {} dist/ \;
          find build -name "*.clap" -maxdepth 6 -exec cp -R {} dist/ \;
          cd dist && zip -r ../plugin-macos.zip .

      - name: Collect (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Get-ChildItem -Path build -Recurse -Directory -Filter *.vst3 | Copy-Item -Destination dist -Recurse
          Get-ChildItem -Path build -Recurse -Filter *.clap -File | Copy-Item -Destination dist
          Compress-Archive -Path dist\* -DestinationPath plugin-windows.zip

      - name: Installer (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: zsh tools/make_installer_mac.sh

      - name: Installer (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          if (-not $iscc) { choco install innosetup -y --no-progress; $iscc = (Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1).FullName }
          $stage = "$PWD\stage"
          New-Item -ItemType Directory -Force "$stage\VST3", "$stage\CLAP" | Out-Null
          Copy-Item -Recurse "build\TheCalm_artefacts\Release\VST3\Die Noise.vst3" "$stage\VST3\"
          Copy-Item "build\TheCalm_artefacts\Release\CLAP\Die Noise.clap" "$stage\CLAP\"
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc /Qp "/DAppVersion=1.0" "/DStage=$stage" installer\TheCalm.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: installer-${{ runner.os }}
          path: |
            dist/*.pkg
            dist/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ runner.os }}
          path: plugin-*.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        continue-on-error: true
        with:
          name: ui-snapshot
          path: ui*.png
